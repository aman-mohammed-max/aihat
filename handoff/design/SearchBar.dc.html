<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search bar component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
input{font-family:inherit}
</style>
</helmet>
<label style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 12px; background: #17191C; padding: 0 12px; color: #ECEDEF; font-family: Geist, system-ui, sans-serif">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9BA0A8" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
  <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{placeholder}}</span>
  <input value="{{value}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; border: none; background: transparent; color: #ECEDEF; font-size: 15px; outline: none">
  <sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #9BA0A8; white-space: nowrap">{{hint}}</span></sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"placeholder":{"editor":"text","default":"Search"},"value":{"editor":"text","default":""},"hint":{"editor":"text","default":""},"$preview":{"width":358,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const hint = this.props.hint ?? '';
    return { placeholder: this.props.placeholder ?? 'Search', value: this.props.value ?? '', hint, hasHint: hint !== '' };
  }
}
</script>
</body>
</html>
