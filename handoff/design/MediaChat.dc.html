<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <dc-import name="Header" left="menu" left-href="Sidebar.dc.html" title="qwen3-vl-32b" sub="Home vLLM" title-href="ModelSheet.dc.html" right="both" right-href="NewChat.dc.html" more-href="ChatMenu.dc.html" accent="{{accent}}" hint-size="100%,100px"></dc-import>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px; overflow: hidden">
    <div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 80%">
      <a href="ImageViewer.dc.html" aria-label="Open attached photo launcher_sketch.jpg" style="width: 150px; height: 112px; border-radius: 14px; background: #2A3240; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #C9CCD1; text-decoration: none">launcher_sketch.jpg</a>

    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="ImageViewer.dc.html" aria-label="Open generated image 1" style="height: 120px; border-radius: 14px; background: #1C2A1E; display: flex; align-items: center; justify-content: center"><span style="width: 44px; height: 44px; background: {{accent}}; border-radius: 6px"></span></a>
        <a href="ImageViewer.dc.html" aria-label="Open generated image 2" style="height: 120px; border-radius: 14px; background: #23202E; display: flex; align-items: center; justify-content: center"><span style="width: 44px; height: 44px; background: #C4B5FD; border-radius: 22px"></span></a>
        <a href="ImageViewer.dc.html" aria-label="Open generated image 3" style="height: 120px; border-radius: 14px; background: #2B2118; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 40px; background: #FDBA74; border-radius: 6px; transform: rotate(45deg)"></span></a>
        <a href="ImageViewer.dc.html" aria-label="Open generated image 4" style="height: 120px; border-radius: 14px; background: #18232B; display: flex; align-items: center; justify-content: center"><span style="width: 44px; height: 30px; background: #7DD3FC; border-radius: 4px"></span></a>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; color: #9BA0A8">
        <button aria-label="Download all" style="width: 36px; height: 36px; border: none; background: transparent; color: inherit"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F46B","options":["#C6F46B","#7DD3FC","#FDBA74","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
