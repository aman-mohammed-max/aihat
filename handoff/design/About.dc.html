<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>About</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDEF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <dc-import name="Header" left="back" left-href="Settings.dc.html" title="About" accent="{{accent}}" hint-size="100%,100px"></dc-import>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 20px 16px 0 16px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 20px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0E0F11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>
      <span style="font-size: 18px; font-weight: 600">[APP NAME]</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #9BA0A8">v0.1.0 (build 12) · React Native</span>
    </div>

    <section style="display: flex; flex-direction: column">
      <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Check for updates</span><span style="font-size: 13px; color: #9BA0A8">Up to date</span></a>
      <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">What's new</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Send feedback or a bug report</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Open-source licences</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="Welcome.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Show the welcome screen again</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </section>

    <section style="display: flex; flex-direction: column">
      <h2 style="margin: 0 0 2px 4px; font-size: 12px; font-weight: 500; color: #9BA0A8">Developer</h2>
      <div style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Developer mode</span><span style="font-size: 12px; color: #9BA0A8">Raw requests, UI specs, timing</span></span><dc-import name="Toggle" on="{{ true }}" label="Developer mode" accent="{{accent}}" hint-size="44px,26px"></dc-import></div>
      <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Request log</span><span style="font-size: 13px; color: #9BA0A8">Last 100</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F46B","options":["#C6F46B","#7DD3FC","#FDBA74","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6F46B' };
  }
}
</script>
</body>
</html>
