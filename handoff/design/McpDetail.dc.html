<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP server detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDEF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <dc-import name="Header" left="back" left-href="Mcp.dc.html" title="github" sub="MCP server" accent="{{accent}}" hint-size="100%,100px"></dc-import>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 8px 16px 0 16px">
    <section style="background: #17191C; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span><span style="flex: 1; font-size: 15px; font-weight: 500">Connected</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9BA0A8">120 ms</span></div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #C9CCD1">https://api.githubcopilot.com/mcp/</span>
      <span style="font-size: 12.5px; color: #9BA0A8">Streamable HTTP · signed in with OAuth</span>
      <div style="display: flex; gap: 8px">
        <a href="ConnectorAuth.dc.html" style="height: 36px; border-radius: 18px; border: 1px solid #2C3036; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-size: 13px">Re-authorise</a>
        <a href="AddMcp.dc.html" style="height: 36px; border-radius: 18px; border: 1px solid #2C3036; display: flex; align-items: center; padding: 0 14px; text-decoration: none; font-size: 13px">Edit</a>
      </div>
    </section>

    <section style="display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 4px 4px"><h2 style="margin: 0; font-size: 12px; font-weight: 500; color: #9BA0A8">Tools · 12</h2><span style="font-size: 12px; color: #9BA0A8">Tap to change</span></div>
      <a href="Picker.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid #1E2125; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Geist Mono', monospace; font-size: 13.5px">search_code</span><span style="font-size: 12px; color: #9BA0A8">Reads</span></span><span style="font-size: 13px; color: #C9CCD1">Auto</span></a>
      <a href="Picker.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid #1E2125; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Geist Mono', monospace; font-size: 13.5px">get_file_contents</span><span style="font-size: 12px; color: #9BA0A8">Reads</span></span><span style="font-size: 13px; color: #C9CCD1">Auto</span></a>
      <a href="GenAction.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid #1E2125; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Geist Mono', monospace; font-size: 13.5px">create_issue</span><span style="font-size: 12px; color: #FDBA74">Writes</span></span><span style="font-size: 13px; color: #C9CCD1">Ask first</span></a>
      <a href="GenAction.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid #1E2125; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Geist Mono', monospace; font-size: 13.5px">create_pull_request</span><span style="font-size: 12px; color: #FDBA74">Writes</span></span><span style="font-size: 13px; color: #C9CCD1">Ask first</span></a>
      <a href="Picker.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; text-decoration: none"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Geist Mono', monospace; font-size: 13.5px">delete_file</span><span style="font-size: 12px; color: #F2A2A2">Deletes</span></span><span style="font-size: 13px; color: #9BA0A8">Off</span></a>
    </section>

    <section style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px"><span style="flex: 1; font-size: 15px">Use in new chats</span><dc-import name="Toggle" on="{{ true }}" label="Use in new chats" accent="{{accent}}" hint-size="44px,26px"></dc-import></div>
    </section>
  </div>

  <div style="padding: 10px 16px 30px 16px">
    <a href="Mcp.dc.html" style="height: 46px; border-radius: 23px; border: 1px solid #2C3036; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14.5px; color: #F2A2A2">Remove server</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F46B","options":["#C6F46B","#7DD3FC","#FDBA74","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6F46B' };
  }
}
</script>
</body>
</html>
