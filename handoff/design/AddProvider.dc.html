<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add OpenAI-compatible endpoint</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDEF}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <dc-import name="Header" left="cancel" left-href="Providers.dc.html" title="New endpoint" right="text" right-text="Save" right-href="ProviderDetail.dc.html" accent="{{accent}}" hint-size="100%,100px"></dc-import>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 0 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">Start from</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="height: 32px; border-radius: 16px; border: none; background: #ECEDEF; color: #0E0F11; font-size: 13px; font-weight: 500; padding: 0 12px">vLLM</button>
        <button style="height: 32px; border-radius: 16px; border: 1px solid #2C3036; background: transparent; color: #C9CCD1; font-size: 13px; padding: 0 12px">Ollama</button>
        <button style="height: 32px; border-radius: 16px; border: 1px solid #2C3036; background: transparent; color: #C9CCD1; font-size: 13px; padding: 0 12px">LM Studio</button>
        <button style="height: 32px; border-radius: 16px; border: 1px solid #2C3036; background: transparent; color: #C9CCD1; font-size: 13px; padding: 0 12px">OpenRouter</button>
        <button style="height: 32px; border-radius: 16px; border: 1px solid #2C3036; background: transparent; color: #C9CCD1; font-size: 13px; padding: 0 12px">Groq</button>
        <button style="height: 32px; border-radius: 16px; border: 1px solid #2C3036; background: transparent; color: #C9CCD1; font-size: 13px; padding: 0 12px">Custom</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pn" style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">Name</label>
      <input id="pn" value="Home vLLM" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #26292E; background: #17191C; color: #ECEDEF; padding: 0 12px; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pu" style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">Base URL</label>
      <input id="pu" value="http://192.168.1.40:8000/v1" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{accent}}; background: #17191C; color: #ECEDEF; padding: 0 12px; font-family: 'Geist Mono', monospace; font-size: 13.5px">
      <span style="font-size: 12px; color: #9BA0A8; padding-left: 4px">Calls <span style="font-family: 'Geist Mono', monospace">/models</span> and <span style="font-family: 'Geist Mono', monospace">/chat/completions</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pk" style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">API key (optional)</label>
      <input id="pk" type="password" value="sk-local-000000" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #26292E; background: #17191C; color: #ECEDEF; padding: 0 12px; font-size: 14px">
    </div>
    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Custom headers</span><span style="font-size: 13px; color: #9BA0A8">None</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

    <section style="background: #17191C; border-radius: 16px; padding: 4px 14px">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 42px; border-bottom: 1px solid #22252A"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span><span style="flex: 1; font-size: 14px; font-weight: 500">Connected · 4 models</span><span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #9BA0A8">38 ms</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 42px"><span style="flex: 1; font-family: 'Geist Mono', monospace; font-size: 13px">qwen3-32b</span><span style="font-size: 11.5px; color: #9BA0A8">tools · 128k</span><dc-import name="Toggle" on="{{ true }}" label="qwen3-32b" accent="{{accent}}" hint-size="44px,26px"></dc-import></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 42px"><span style="flex: 1; font-family: 'Geist Mono', monospace; font-size: 13px">qwen3-vl-32b</span><span style="font-size: 11.5px; color: #9BA0A8">vision · 32k</span><dc-import name="Toggle" on="{{ true }}" label="qwen3-vl-32b" accent="{{accent}}" hint-size="44px,26px"></dc-import></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 42px"><span style="flex: 1; font-family: 'Geist Mono', monospace; font-size: 13px">nomic-embed</span><span style="font-size: 11.5px; color: #9BA0A8">embeddings</span><dc-import name="Toggle" on="{{ false }}" label="nomic-embed" accent="{{accent}}" hint-size="44px,26px"></dc-import></div>
    </section>
  </div>

  <div style="padding: 10px 16px 30px 16px">
    <button style="width: 100%; height: 48px; border-radius: 24px; border: 1px solid #2C3036; background: transparent; color: #ECEDEF; font-size: 15px">Test connection</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F46B","options":["#C6F46B","#7DD3FC","#FDBA74","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6F46B' };
  }
}
</script>
</body>
</html>
