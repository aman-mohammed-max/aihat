<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approve a generated action</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDEF}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0">
    <dc-import name="Header" left="menu" left-href="Sidebar.dc.html" title="qwen3-32b" sub="Home vLLM" title-href="ModelSheet.dc.html" right="both" right-href="NewChat.dc.html" accent="{{accent}}" hint-size="100%,100px"></dc-import>
  </div>
  <div aria-hidden="true" style="padding: 110px 16px 0 16px; display: flex; flex-direction: column; gap: 14px; opacity: 0.35">
    <div style="align-self: flex-end; background: #22252A; border-radius: 18px; padding: 10px 14px; font-size: 15px">File a bug for the freeze on restart</div>
    <div style="background: #17191C; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 16px; font-weight: 600">New issue · qemu-mod</span>
      <span style="font-size: 14px; color: #C9CCD1">Game freezes when the VM restarts</span>
      <span style="height: 44px; border-radius: 22px; background: {{accent}}"></span>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

  <section role="dialog" aria-label="Allow this action?" style="position: absolute; left: 0; right: 0; bottom: 0; background: #17191C; border-radius: 28px 28px 0 0; padding: 10px 20px 34px 20px; display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #3A3F46"></span>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #22252A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 01-10 0zM12 16v5"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Allow this action?</span><span style="font-size: 13px; color: #9BA0A8">The “Create issue” button wants to run a tool</span></span>
    </div>

    <div style="background: #0E0F11; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-family: 'Geist Mono', monospace; font-size: 13px; flex: 1">github.create_issue</span>
        <span style="font-size: 11px; color: #FDBA74; border: 1px solid #5A4128; border-radius: 6px; padding: 2px 6px">Writes data</span>
      </div>
      <pre style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 12px; line-height: 1.6; color: #C9CCD1; white-space: pre-wrap">repo:   "aman/qemu-mod"
title:  "Game freezes when VM restarts"
labels: ["bug", "beta"]</pre>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="height: 50px; border-radius: 25px; border: none; background: {{accent}}; color: #0E0F11; font-size: 15px; font-weight: 600">Allow once</button>
      <button style="height: 50px; border-radius: 25px; border: 1px solid #2C3036; background: transparent; color: #ECEDEF; font-size: 15px">Always allow in this chat</button>
      <button style="height: 44px; border: none; background: transparent; color: #9BA0A8; font-size: 15px">Deny</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F46B","options":["#C6F46B","#7DD3FC","#FDBA74","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6F46B' };
  }
}
</script>
</body>
</html>
