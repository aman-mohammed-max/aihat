<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 50px 6px 6px 6px; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif">
  <div style="width: 88px; display: flex; align-items: center">
    <sc-if value="{{isMenu}}" hint-placeholder-val="{{ true }}">
      <a href="{{leftHref}}" aria-label="Open menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEDEF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"></path></svg></a>
    </sc-if>
    <sc-if value="{{isBack}}" hint-placeholder-val="{{ false }}">
      <a href="{{leftHref}}" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEDEF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    </sc-if>
    <sc-if value="{{isClose}}" hint-placeholder-val="{{ false }}">
      <a href="{{leftHref}}" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEDEF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </sc-if>
    <sc-if value="{{isCancel}}" hint-placeholder-val="{{ false }}">
      <a href="{{leftHref}}" style="height: 44px; display: flex; align-items: center; padding: 0 10px; color: #C9CCD1; text-decoration: none; font-size: 15px">Cancel</a>
    </sc-if>
  </div>

  <div style="flex: 1; min-width: 0; display: flex; justify-content: center">
    <sc-if value="{{titleLinks}}" hint-placeholder-val="{{ false }}">
      <a href="{{titleHref}}" style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 10px; border-radius: 12px; color: #ECEDEF; text-decoration: none; min-width: 0">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 600; white-space: nowrap">{{title}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9BA0A8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
        <sc-if value="{{hasSub}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #9BA0A8; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>{{sub}}</span></sc-if>
      </a>
    </sc-if>
    <sc-if value="{{titlePlain}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0">
        <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{title}}</span>
        <sc-if value="{{hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11.5px; color: #9BA0A8; white-space: nowrap">{{sub}}</span></sc-if>
      </span>
    </sc-if>
  </div>

  <div style="width: 88px; display: flex; align-items: center; justify-content: flex-end">
    <sc-if value="{{isNew}}" hint-placeholder-val="{{ false }}">
      <a href="{{rightHref}}" aria-label="New chat" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEDEF"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h8"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></a>
    </sc-if>
    <sc-if value="{{isMore}}" hint-placeholder-val="{{ false }}">
      <a href="{{moreHref}}" aria-label="More options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEDEF"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></a>
    </sc-if>
    <sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
      <a href="{{rightHref}}" aria-label="{{addLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEDEF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </sc-if>
    <sc-if value="{{isText}}" hint-placeholder-val="{{ false }}">
      <a href="{{rightHref}}" style="height: 44px; display: flex; align-items: center; padding: 0 10px; color: {{accent}}; text-decoration: none; font-size: 15px; font-weight: 600">{{rightText}}</a>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"left":{"editor":"enum","options":["menu","back","close","cancel","none"],"default":"back"},"leftHref":{"editor":"text","default":"Main.dc.html"},"title":{"editor":"text","default":"Title"},"sub":{"editor":"text","default":""},"titleHref":{"editor":"text","default":""},"right":{"editor":"enum","options":["new","more","both","add","text","none"],"default":"none"},"rightHref":{"editor":"text","default":"#"},"moreHref":{"editor":"text","default":"ChatMenu.dc.html"},"rightText":{"editor":"text","default":"Save"},"addLabel":{"editor":"text","default":"Add"},"accent":{"editor":"color","default":"#C6F46B"},"$preview":{"width":390,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const left = p.left ?? 'back';
    const right = p.right ?? 'none';
    const titleHref = p.titleHref ?? '';
    const sub = p.sub ?? '';
    return {
      accent: p.accent ?? '#C6F46B',
      title: p.title ?? 'Title',
      sub,
      hasSub: sub !== '',
      leftHref: p.leftHref ?? 'Main.dc.html',
      rightHref: p.rightHref ?? '#',
      rightText: p.rightText ?? 'Save',
      addLabel: p.addLabel ?? 'Add',
      titleHref,
      titleLinks: titleHref !== '',
      titlePlain: titleHref === '',
      isMenu: left === 'menu', isBack: left === 'back', isClose: left === 'close', isCancel: left === 'cancel',
      isNew: right === 'new' || right === 'both', isMore: right === 'more' || right === 'both', moreHref: p.moreHref ?? 'ChatMenu.dc.html', isAdd: right === 'add', isText: right === 'text'
    };
  }
}
</script>
</body>
</html>
