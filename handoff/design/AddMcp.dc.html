<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add MCP server</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDEF}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #ECEDEF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <dc-import name="Header" left="cancel" left-href="Mcp.dc.html" title="Add MCP server" right="text" right-text="Add" right-href="McpDetail.dc.html" accent="{{accent}}" hint-size="100%,100px"></dc-import>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 0 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #17191C; border-radius: 12px; padding: 4px">
      <button style="height: 36px; border: none; border-radius: 9px; background: #2E3238; color: #ECEDEF; font-size: 13.5px">Server URL</button>
      <button style="height: 36px; border: none; border-radius: 9px; background: transparent; color: #9BA0A8; font-size: 13.5px">Paste JSON config</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mn" style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">Name</label>
      <input id="mn" value="postgres" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #26292E; background: #17191C; color: #ECEDEF; padding: 0 12px; font-family: 'Geist Mono', monospace; font-size: 14px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mu" style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">Server URL</label>
      <input id="mu" value="https://home.local:8811/postgres/mcp" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{accent}}; background: #17191C; color: #ECEDEF; padding: 0 12px; font-family: 'Geist Mono', monospace; font-size: 13px">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500; color: #9BA0A8; padding-left: 4px">Sign-in</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #17191C; border-radius: 12px; padding: 4px">
        <button style="height: 36px; border: none; border-radius: 9px; background: transparent; color: #9BA0A8; font-size: 13.5px">None</button>
        <button style="height: 36px; border: none; border-radius: 9px; background: #2E3238; color: #ECEDEF; font-size: 13.5px">API token</button>
        <button style="height: 36px; border: none; border-radius: 9px; background: transparent; color: #9BA0A8; font-size: 13.5px">OAuth</button>
      </div>
      <label for="mk" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">API token</label>
      <input id="mk" type="password" value="xxxxxxxxxxxxxxxx" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #26292E; background: #17191C; color: #ECEDEF; padding: 0 12px; font-size: 14px">
    </div>

    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 15px"><span style="flex: 1">Custom headers</span><span style="font-size: 13px; color: #9BA0A8">None</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F747C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

    <div style="display: flex; align-items: center; gap: 10px; background: #17191C; border-radius: 14px; padding: 12px 14px">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
      <span style="flex: 1; font-size: 14px">Connected · 6 tools found</span>
      <button style="height: 32px; border-radius: 16px; border: 1px solid #2C3036; background: transparent; color: #ECEDEF; font-size: 12.5px; padding: 0 12px">Test again</button>
    </div>
  </div>

  <div style="padding: 10px 16px 30px 16px">
    <a href="McpDetail.dc.html" style="height: 48px; border-radius: 24px; background: {{accent}}; color: #0E0F11; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Add server</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F46B","options":["#C6F46B","#7DD3FC","#FDBA74","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6F46B' };
  }
}
</script>
</body>
</html>
