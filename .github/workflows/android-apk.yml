name: Android APK

# Builds installable release APKs for llama.rn's supported Android ABIs.
#   AI-Hat-<label>.apk                  universal: 64-bit ARM and x86_64 (multi-ABI runs)
#   AI-Hat-<label>-Android-arm64.apk    64-bit ARM (arm64-v8a)
#   AI-Hat-<label>-Android-x86_64.apk   64-bit Intel/AMD (x86_64)
#   Manual runs default to both ABIs; main-branch/tag releases target arm64-v8a for the ARM Chromebook.
#   For a public release, push a tag (see release.yml), which builds this and the other apps together.
#
# With no secrets it is signed with the debug key Expo generates: fine for installing on your own phone.
# For a key of your own, add these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the .jks/.keystore file, base64-encoded   (base64 -w0 my.keystore)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      abis:
        description: CPU architectures to build (comma separated; fewer is faster). Multiple ABIs produce per-ABI and universal APKs.
        default: arm64-v8a,x86_64
  workflow_call:
    inputs:
      abis:
        type: string
        default: arm64-v8a
      label:
        description: Used in the file name, for example the release tag
        type: string
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools ndk;27.1.12297006'

      - name: Install Android 17 preview SDK required by Expo SDK 58
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Verify llama.rn Android native artifacts
        run: test -f node_modules/llama.rn/android/src/main/jniLibs/.llama-rn.sha256

      - name: Number this build
        run: |
          node -e "
            const fs = require('fs'); const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.android.versionCode = Number(process.env.RUN);
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2));
          "
        env:
          RUN: ${{ github.run_number }}

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Sign with my keystore (only when the secrets are set)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          release = """signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }"""
          assert 'signingConfigs {' in s, 'signingConfigs block not found'
          s = s.replace('signingConfigs {', release, 1)
          s, n = re.subn(r'(buildTypes \{.*?release \{.*?)signingConfig signingConfigs\.debug', r'\1signingConfig signingConfigs.release', s, count=1, flags=re.S)
          assert n == 1, 'release signingConfig line not found'
          open(p, 'w').write(s)
          PY

      - name: Configure ABI splits for multi-architecture builds
        env:
          ABIS: ${{ inputs.abis || 'arm64-v8a,x86_64' }}
        run: |
          python3 - <<'PY'
          import os, re
          abis = [a.strip() for a in os.environ['ABIS'].split(',') if a.strip()]
          known = {'arm64-v8a', 'x86_64'}
          assert abis and set(abis) <= known, f'unknown architecture in {abis}; use {sorted(known)}'
          if len(abis) == 1:
              print('One architecture: a single APK, no splits.')
              raise SystemExit(0)
          p = 'android/app/build.gradle'
          s = open(p).read()
          # An older template's own splits block is replaced (matched by its braces).
          at = s.find('splits {')
          if at != -1:
              depth, end = 0, at
              for i in range(s.index('{', at), len(s)):
                  depth += {'{': 1, '}': -1}.get(s[i], 0)
                  if depth == 0:
                      end = i + 1
                      break
              s = s[:s.rfind('\n', 0, at) + 1] + s[end:].lstrip(' ').lstrip('\n')
          include = ', '.join('"%s"' % a for a in abis)
          block = ('    splits {\n        abi {\n            enable true\n            reset()\n'
                   '            include ' + include + '\n'
                   '            universalApk true\n        }\n    }\n')
          s, n = re.subn(r'^android \{\n', lambda m: m.group(0) + block, s, count=1, flags=re.M)
          assert n == 1, 'the android { block was not found in build.gradle'
          open(p, 'w').write(s)
          print(block)
          PY

      - name: Build the release APKs
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=${{ inputs.abis || 'arm64-v8a,x86_64' }}
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Name the files
        env:
          LABEL: ${{ inputs.label || format('build-{0}', github.run_number) }}
          ABIS: ${{ inputs.abis || 'arm64-v8a,x86_64' }}
        run: |
          mkdir -p out
          cd android/app/build/outputs/apk/release
          ls -l
          if [ -f app-universal-release.apk ]; then
            cp app-universal-release.apk "$GITHUB_WORKSPACE/out/AI-Hat-$LABEL.apk"
            for abi in arm64-v8a x86_64; do
              [ -f "app-$abi-release.apk" ] || continue
              case "$abi" in arm64-v8a) name=arm64 ;; *) name=$abi ;; esac
              cp "app-$abi-release.apk" "$GITHUB_WORKSPACE/out/AI-Hat-$LABEL-Android-$name.apk"
            done
          else
            case "$ABIS" in
              arm64-v8a) name=arm64 ;;
              x86_64) name=x86_64 ;;
              *) name=single ;;
            esac
            cp app-release.apk "$GITHUB_WORKSPACE/out/AI-Hat-$LABEL-Android-$name.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v7
        with:
          name: AI-Hat-apk
          path: out/*.apk
          if-no-files-found: error
