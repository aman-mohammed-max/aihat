name: Desktop apps

# Builds AI Hat for macOS (Apple Silicon and Intel), Windows (x64 and ARM64) and Linux (x64 and ARM64, as .deb and
# Flatpak): the web build of the app in an Electrobun window (the system's own web view, with a Bun backend). Each
# system builds on its own runner because the desktop builder can't cross-compile. Called by "Build & Release"; can
# also be run by hand.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: Used in the file names, for example the release tag
        type: string
        default: ''

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-arm64, runner: macos-15 }
          - { name: macOS-x64, runner: macos-15-intel }
          - { name: Windows-x64, runner: windows-latest }
          - { name: Windows-arm64, runner: windows-11-arm }
          - { name: Linux-x64, runner: ubuntu-24.04 }
          - { name: Linux-arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ inputs.label || format('build-{0}', github.run_number) }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Retried: downloads now and then fail on the hosted runners (once on Windows ARM64 after passing the run before).
      - name: Install dependencies
        run: |
          for try in 1 2 3; do
            npm ci && (cd desktop && bun install --frozen-lockfile && bunx electrobun sync) && exit 0
            echo "::warning::Installing dependencies failed (try $try of 3)"; sleep 20
          done
          exit 1

      - name: Build the web app
        run: npx expo export --platform web

      - name: Test the backend
        working-directory: desktop
        run: bun test

      - name: Build the desktop app
        working-directory: desktop
        run: bunx electrobun build --env=stable

      - name: Name the files
        working-directory: desktop
        run: |
          ls -la artifacts
          mkdir -p out
          shopt -s nullglob
          for f in artifacts/*.dmg; do cp "$f" "out/AI-Hat-$LABEL-$NAME.dmg"; done
          # Windows: one Setup .exe with the app inside, instead of Electrobun's zip.
          for f in artifacts/*Setup*.zip; do
            7z x -y -owin-setup "$f" >/dev/null || powershell -command "Expand-Archive -Force '$f' win-setup"
            bun scripts/package.ts exe win-setup "out/AI-Hat-$LABEL-$NAME-Setup.exe"
          done
          # Linux: a .deb for Debian and Ubuntu.
          if [[ "$NAME" == Linux-* ]]; then
            for f in artifacts/stable-linux-*.tar.zst; do bun scripts/package.ts deb "$f" "${NAME#Linux-}" "out/AI-Hat-$LABEL-$NAME.deb"; done
          fi
          ls -la out
          [ -n "$(ls out)" ] || { echo "::error::The desktop build made no installer."; exit 1; }

      # Linux: the files the Flatpak is built from (the flatpak job below builds it in Flathub's container).
      - name: Prepare the Flatpak
        if: startsWith(matrix.name, 'Linux-')
        working-directory: desktop
        run: bun scripts/package.ts flatpak artifacts/stable-linux-*.tar.zst fp

      - if: startsWith(matrix.name, 'Linux-')
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-source-${{ matrix.name }}
          path: desktop/fp
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Hat-desktop-${{ matrix.name }}
          path: desktop/out/*
          if-no-files-found: error

  # Flatpak for Linux x64 and ARM64, built in Flathub's GNOME container (which has flatpak-builder and the GNOME
  # runtime and SDK the manifest uses). Runs even if another desktop build failed.
  flatpak:
    name: Flatpak-${{ matrix.name }}
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux-x64, arch: x86_64, runner: ubuntu-24.04 }
          - { name: Linux-arm64, arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      BUNDLE: AI-Hat-${{ inputs.label || format('build-{0}', github.run_number) }}-${{ matrix.name }}.flatpak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-source-${{ matrix.name }}
          path: fp

      - name: Flathub's shared modules (the tray-icon library)
        run: git clone -q --depth 1 https://github.com/flathub/shared-modules fp/shared-modules

      # flatpak-builder run directly (not through Flathub's action) so that, when it fails, the end of its log
      # shows up as an error annotation on the run, which can be read without signing in.
      - name: Build the Flatpak
        shell: bash
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean \
              --arch=${{ matrix.arch }} --repo=fp-repo fp-build fp/com.amanm.aihat.yml > fp.log 2>&1; then
            tail -n 80 fp.log
            echo "::error title=flatpak-builder failed::$(tail -n 40 fp.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -n 5 fp.log
          flatpak build-bundle --arch=${{ matrix.arch }} --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo fp-repo "$BUNDLE" com.amanm.aihat
          ls -la "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Hat-desktop-flatpak-${{ matrix.name }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
