name: Build & Release

# Builds the Android APKs, the iOS IPA and the desktop apps (macOS, Windows, Linux) and puts them on the Releases page.
#
# Architectures:
#   Android   universal APK, plus one each for arm64-v8a and x86_64 (llama.rn native targets)
#   iOS       arm64 (every iPhone and iPad; Apple has no other kind)
#   macOS     arm64 (Apple Silicon) and x64 (Intel)
#   Windows   x64 and arm64
#   Linux     x64 and arm64, each as a .deb and a Flatpak
# There are no 32-bit desktop builds: the desktop app runs on Bun, which is 64-bit only.
#
#   Push to main        → the "latest beta build" pre-release (tag beta-latest) is replaced with fresh files.
#   Push a version tag  → a permanent release for that version:
#                           git tag v0.1.0-beta.2 && git push origin v0.1.0-beta.2
#                         A tag with a hyphen (-beta.2, -rc.1) is marked as a pre-release; v1.0.0 is a normal release.
#   Run it by hand      → Actions → "Build & Release" → Run workflow (optionally type a version tag).
#
# If one platform fails, the others are still published and the notes list only the files that exist.
# Changes that only touch docs or the design files don't start a build.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'handoff/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, for example v0.1.0-beta.2. Leave empty to update the "latest beta build".'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      rolling: ${{ steps.p.outputs.rolling }}
      prerelease: ${{ steps.p.outputs.prerelease }}
    steps:
      - id: p
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then TAG="$INPUT_VERSION"
          else TAG="beta-latest"; fi

          if [[ "$TAG" != "beta-latest" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag. Use something like v0.1.0 or v0.1.0-beta.2."
            exit 1
          fi
          ROLLING=false; [[ "$TAG" == "beta-latest" ]] && ROLLING=true
          PRERELEASE=false; [[ "$TAG" == *-* ]] && PRERELEASE=true
          {
            echo "tag=$TAG"
            echo "rolling=$ROLLING"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing as $TAG (rolling=$ROLLING, prerelease=$PRERELEASE)"

  android:
    needs: plan
    uses: ./.github/workflows/android-apk.yml
    with:
      abis: arm64-v8a
      label: ${{ needs.plan.outputs.tag }}
    secrets: inherit

  ios:
    needs: plan
    uses: ./.github/workflows/ios-ipa.yml
    with:
      label: ${{ needs.plan.outputs.tag }}
    secrets: inherit

  desktop:
    needs: plan
    uses: ./.github/workflows/desktop.yml
    with:
      label: ${{ needs.plan.outputs.tag }}

  publish:
    needs: [plan, android, ios, desktop]
    # The desktop matrix counts as done when at least one system built (its jobs don't stop each other).
    # !cancelled(): a build stopped by a newer push publishes nothing (it used to replace the release with only the
    # platforms that had finished). A platform that fails on its own is still left out, as before.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.android.result == 'success' || needs.ios.result == 'success' || needs.desktop.result != 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      ROLLING: ${{ needs.plan.outputs.rolling }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: AI-Hat-*
          merge-multiple: true
          path: dist

      # The rolling beta is replaced on every push: a phone build that failed this time keeps the last good APK or IPA
      # instead of disappearing from the page until the next good build.
      - name: Keep the last beta's phone app when this build of it failed
        if: ${{ needs.plan.outputs.rolling == 'true' && (needs.android.result != 'success' || needs.ios.result != 'success') }}
        env:
          ANDROID_OK: ${{ needs.android.result == 'success' }}
          IOS_OK: ${{ needs.ios.result == 'success' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || exit 0
          kept=()
          if [[ "$ANDROID_OK" != true ]] && gh release download "$TAG" --pattern '*.apk' --dir dist --clobber; then kept+=(Android); fi
          if [[ "$IOS_OK" != true ]] && gh release download "$TAG" --pattern '*.ipa' --dir dist --clobber; then kept+=(iPhone/iPad); fi
          if (( ${#kept[@]} )); then
            echo "The ${kept[*]} app in this release is from the previous beta build: this build of it didn't finish." > carried-over.txt
            cat carried-over.txt
          fi

      - name: Check something was built
        run: '[ -n "$(ls -A dist 2>/dev/null)" ] || { echo "::error::No app was built, so there is nothing to publish."; exit 1; }'

      - name: Write the release notes
        run: |
          {
            if [[ "$PRERELEASE" == true ]]; then
              echo '> **Beta.** AI Hat is still in beta. Expect rough edges, and please report problems under Issues.'
              echo
            fi
            if [[ "$ROLLING" == true ]]; then
              echo "**Latest beta build** of \`main\` at commit \`${GITHUB_SHA::7}\`, built $(date -u '+%Y-%m-%d %H:%M UTC'). This release is replaced by a fresh build on every push. For a fixed version, use a numbered release."
              echo
            fi
            if [[ -f carried-over.txt ]]; then
              echo "> $(cat carried-over.txt)"
              echo
            fi
            echo '## Install'
            echo
            if compgen -G 'dist/*.apk' >/dev/null; then cat <<NOTE
          **Android:** \`AI-Hat-$TAG.apk\` is the universal one for supported 64-bit ARM and x86_64 devices. Smaller \`-Android-\` files target one processor: **arm64** for Android phones and tablets or **x86_64** for compatible Chromebooks and emulators. The local model engine requires one of these 64-bit ABIs. Open the file on your phone and allow installs from that app when asked ("Install unknown apps"). Android may show a Play Protect warning because the app isn't from the Play Store.

          NOTE
            fi
            for f in dist/*.ipa; do [ -e "$f" ] || continue; cat <<NOTE
          **iPhone / iPad:** \`$(basename "$f")\` is **unsigned**, so it will not install by tapping it. Open it with [AltStore](https://altstore.io), [SideStore](https://sidestore.io) or [Sideloadly](https://sideloadly.io), which sign it with your own Apple ID. Apps signed with a free Apple ID expire after 7 days and need re-signing.

          NOTE
            done
            for f in dist/*-macOS-*.dmg; do [ -e "$f" ] || continue; cat <<NOTE
          **Mac** ($(basename "$f" .dmg | sed 's/.*-macOS-//; s/arm64/Apple Silicon/; s/x64/Intel/')): open \`$(basename "$f")\`, drag AI Hat to Applications. The app isn't signed by Apple yet, so the first time, right-click it and choose **Open** (or System Settings › Privacy & Security › **Open Anyway**). If macOS says it is damaged, run \`xattr -cr "/Applications/AI Hat.app"\` in Terminal once.

          NOTE
            done
            for f in dist/*-Windows-*-Setup.exe; do [ -e "$f" ] || continue; cat <<NOTE
          **Windows** ($(basename "$f" -Setup.exe | sed 's/.*-Windows-//; s/x64/Intel or AMD PCs/; s/arm64/ARM PCs/')): download \`$(basename "$f")\` and run it; AI Hat installs and appears in the Start menu and on the desktop. Windows SmartScreen may say it protected your PC because the app isn't signed yet: choose **More info › Run anyway**. Uses Microsoft Edge WebView2, which Windows 10 and 11 already have.

          NOTE
            done
            for f in dist/*-Linux-*.deb; do [ -e "$f" ] || continue; cat <<NOTE
          **Debian / Ubuntu** ($(basename "$f" .deb | sed 's/.*-Linux-//')): \`sudo apt install ./$(basename "$f")\`, or open it with your software installer; AI Hat appears in your app menu, and \`ai-hat\` starts it from a terminal. Needs Debian 12, Ubuntu 22.04 or newer (apt fetches WebKitGTK 4.1 for you). Your keys go in your desktop's keyring (GNOME Keyring or KWallet); without one, in a private file.

          NOTE
            done
            for f in dist/*-Linux-*.flatpak; do [ -e "$f" ] || continue; cat <<NOTE
          **Flatpak, any Linux** ($(basename "$f" .flatpak | sed 's/.*-Linux-//')): \`flatpak install --user ./$(basename "$f")\` (with Flathub set up, so the GNOME runtime can be fetched), then start AI Hat from your app menu or with \`flatpak run com.amanm.aihat\`.

          NOTE
            done
            echo '## What changed'
            echo
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
            if [[ "$ROLLING" != true && -n "$PREV" && "$PREV" != "$TAG" ]]; then
              git log --no-merges --pretty='- %s (%h)' "$PREV..$GITHUB_SHA" | head -40
            else
              git log --no-merges --pretty='- %s (%h)' -10 "$GITHUB_SHA"
            fi
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish the release
        run: |
          if [[ "$ROLLING" == true ]]; then TITLE="AI Hat: latest beta build"; else TITLE="AI Hat $TAG"; fi
          FLAGS=()
          [[ "$PRERELEASE" == true ]] && FLAGS+=(--prerelease)
          [[ "$ROLLING" == true ]] && FLAGS+=(--latest=false)

          # Replace an existing release of the same tag (a re-run, or the rolling beta). The rolling tag is
          # deleted too so it moves to this commit; a version tag you pushed stays where it is.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$ROLLING" == true ]]; then gh release delete "$TAG" --yes --cleanup-tag
            else gh release delete "$TAG" --yes; fi
          fi
          gh release create "$TAG" dist/* --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA" "${FLAGS[@]}"
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
