name: Check

# Type-checks and lints on every push to main and every pull request (the app, and the desktop backend with its tests).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - working-directory: desktop
        run: bun install --frozen-lockfile && bunx electrobun sync
      - working-directory: desktop
        run: bun test
      - working-directory: desktop
        run: bun scripts/typecheck.ts
