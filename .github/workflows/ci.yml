name: Check

# Type-checks and lints on every branch push and every pull request (the app, the desktop backend with its tests,
# and the skill-script runner).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

  android-build:
    name: Android debug build (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools ndk;27.1.12297006'
      - name: Install Android 17 preview SDK required by Expo SDK 58
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: npm ci
      - name: Verify llama.rn Android native artifacts
        run: test -f node_modules/llama.rn/android/src/main/jniLibs/.llama-rn.sha256
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Download the pinned Phonon archive for the extraction integration test
        env:
          PHONON_ARCHIVE_URL: https://huggingface.co/FermionResearch/Phonon-2/resolve/3e6ab3a81d73b4d424ff34cc72535deb606378ef/phonon-2.bps.tar.zst?download=true
          PHONON_ARCHIVE_SHA256: 98125795b6dda72f5c6eee9ba33d19815df65dcb18b50a357bf9f73c9935309e
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/phonon-2.bps.tar.zst" "$PHONON_ARCHIVE_URL"
          echo "$PHONON_ARCHIVE_SHA256  $RUNNER_TEMP/phonon-2.bps.tar.zst" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/phonon-2.bps.tar.zst")" -eq 163515201
      - name: Run Android unit tests and extract the pinned publisher archive
        working-directory: android
        env:
          PHONON_TEST_ARCHIVE: ${{ runner.temp }}/phonon-2.bps.tar.zst
        run: ./gradlew testDebugUnitTest --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-arm64
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios-simulator-build:
    name: iOS simulator model smoke test
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_PHONON_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate a short speech fixture
        run: |
          say -o "$RUNNER_TEMP/phonon-smoke.aiff" 'Please transcribe this short test sentence.'
          afconvert -f WAVE -d LEI16@16000 "$RUNNER_TEMP/phonon-smoke.aiff" assets/phonon-smoke.wav
      - name: Verify llama.rn iOS native artifact
        run: test -f node_modules/llama.rn/ios/rnllama.xcframework/.llama-rn.sha256
      - run: npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build unsigned iOS simulator app with the Phonon smoke route enabled
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
      - name: Run Phonon and local LLM smoke tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" com.amanm.aihat
          DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.amanm.aihat data)
          RESULT="$DATA/Documents/phonon-smoke-result.json"
          echo "PHONON_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "PHONON_RESULT_PATH=$RESULT" >> "$GITHUB_ENV"
          PREVIOUS_RESULT=''
          for attempt in $(seq 1 720); do
            if [ -f "$RESULT" ]; then
              CURRENT_RESULT=$(cat "$RESULT")
              if [ "$CURRENT_RESULT" != "$PREVIOUS_RESULT" ]; then
                echo "$CURRENT_RESULT"
                PREVIOUS_RESULT=$CURRENT_RESULT
              fi
              if grep -q '"status":"passed"' "$RESULT"; then exit 0; fi
              if grep -q '"status":"failed"' "$RESULT"; then exit 1; fi
            fi
            sleep 5
          done
          echo 'Mobile model smoke test timed out.'
          exit 1
      - name: Capture iOS smoke diagnostics
        if: failure()
        run: |
          if [ -n "${PHONON_RESULT_PATH:-}" ] && [ -f "$PHONON_RESULT_PATH" ]; then
            cp "$PHONON_RESULT_PATH" "$RUNNER_TEMP/phonon-smoke-result.json"
            cat "$PHONON_RESULT_PATH"
          else
            echo 'The smoke route did not create its result marker.'
          fi
          if [ -n "${PHONON_SIMULATOR_ID:-}" ]; then
            python3 - "$PHONON_SIMULATOR_ID" "$RUNNER_TEMP" <<'PY'
          import pathlib
          import subprocess
          import sys

          device, temp = sys.argv[1:]
          output = pathlib.Path(temp)
          commands = [
              (["xcrun", "simctl", "io", device, "screenshot", str(output / "phonon-smoke-screen.png")], "phonon-smoke-screenshot.txt", 20),
              (["xcrun", "simctl", "spawn", device, "log", "show", "--last", "1m", "--style", "compact", "--predicate", 'eventMessage CONTAINS "PHONON_SMOKE"'], "phonon-smoke-log.txt", 30),
          ]
          for command, filename, seconds in commands:
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=seconds, check=False)
                  output.joinpath(filename).write_text(result.stdout + result.stderr)
              except subprocess.TimeoutExpired as error:
                  captured = error.stdout or b""
                  if isinstance(captured, bytes):
                      captured = captured.decode(errors="replace")
                  output.joinpath(filename).write_text(captured + f"\nTimed out after {seconds}s: {command!r}\n")
          PY
            tail -80 "$RUNNER_TEMP/phonon-smoke-log.txt" || true
          fi
      - name: Upload iOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke-diagnostics
          path: ${{ runner.temp }}/phonon-smoke-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error

  android-phonon-runtime:
    name: Android ARM64 release model smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_PHONON_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools emulator ndk;27.1.12297006'
      - name: Install Android 17 preview SDK required by Expo SDK 58
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Install eSpeak NG for a real speech fixture
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: npm ci
      - name: Verify llama.rn Android native artifacts
        run: test -f node_modules/llama.rn/android/src/main/jniLibs/.llama-rn.sha256
      - name: Generate a short speech fixture
        run: espeak-ng -v en-us -s 140 -w assets/phonon-smoke.wav 'Please transcribe this short test sentence.'
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build the minified ARM64 release app with the Phonon smoke route enabled
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Phonon and local LLM smoke tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 6144
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/phonon-android-smoke.sh
      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke-diagnostics
          path: ${{ runner.temp }}/phonon-android-*
          if-no-files-found: ignore

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm run test:expo-cli-compat
      - run: npm run test:navigation
      - run: npm run test:local-stream
      - run: npm run test:local-runtime
      - run: npm run test:local-backends
      - run: npm run test:local-models
      - run: npm run test:phonon-download
      - run: npm run test:marketplace
      - run: npm run docs:check

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - working-directory: desktop
        run: bun install --frozen-lockfile && bunx electrobun sync
      - working-directory: desktop
        run: bun test
      - working-directory: desktop
        run: bun scripts/typecheck.ts

  skill-engine:
    # The phone's skill-script runner: the embedded page is current, every pinned download still matches its
    # checksum, and the self-tests pass with the real Pyodide and libraries.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/embed-skill-engine.mjs --check
      - uses: actions/cache@v5
        with:
          path: .skill-runtime-cache
          key: skill-runtime-${{ hashFiles('scripts/skill-runtime-manifest.mjs') }}
      - run: node scripts/skill-runtime-manifest.mjs .skill-runtime-cache
      - run: git diff --exit-code src/skill-exec/runtime.json
      - run: node scripts/skill-runtime-test.mjs .skill-runtime-cache

  skill-engine-browsers:
    # The same checks inside real browser engines, the way phones run them: Chromium (Android's WebView) on Linux,
    # WebKit (the iPhone's engine) on a Mac.
    name: skill-engine-${{ matrix.engine }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, runner: ubuntu-24.04 }
          - { engine: webkit, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          path: .skill-runtime-cache
          key: skill-runtime-${{ hashFiles('scripts/skill-runtime-manifest.mjs') }}
      - run: node scripts/skill-runtime-manifest.mjs .skill-runtime-cache
      - run: npm i --no-save --no-package-lock playwright-core@1.64.1 && npx playwright-core install ${{ matrix.engine }}
      - run: node scripts/skill-runtime-browser-test.mjs .skill-runtime-cache ${{ matrix.engine }}
