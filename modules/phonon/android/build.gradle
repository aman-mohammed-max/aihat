plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.amanm.aihat'
version = '1.0.0'

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "expo.modules.phonon"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    externalNativeBuild {
      cmake {
        abiFilters (*reactNativeArchitectures())
        arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
}

dependencies {
  // Unpacks the model download (a zstd-compressed tar).
  implementation "com.github.luben:zstd-jni:1.5.7-3@aar"
  // Host JVM unit tests need zstd-jni's Linux native binary; the Android AAR only packages Android ABIs.
  testImplementation "com.github.luben:zstd-jni:1.5.7-3"
  // Use a real JSON implementation in local JVM tests instead of Android's mocked android.jar stubs.
  testImplementation 'org.json:json:20250517'
  testImplementation 'junit:junit:4.13.2'
}
